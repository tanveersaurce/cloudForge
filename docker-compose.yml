services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cloudforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudforge} -d ${POSTGRES_DB:-cloudforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudforge_pgdata:
    driver: local
